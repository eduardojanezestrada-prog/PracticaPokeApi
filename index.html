<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pokemon team</title>
    <link rel="shortcut icon" href="./images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/normalize.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/estilos.css">
</head>
<body>
    <select id="gen" onchange="init()">
        <option value="0">Elige una region</option>
        <option value="1">Primera</option>
        <option value="2">Segunda</option>
        <option value="3">Tercera</option>
        <option value="4">Cuarta</option>
        <option value="5">Quinta</option>
        <option value="6">Sexta</option>
        <option value="7">Septima</option>
        <option value="8">Octava</option>
        <option value="9">Novena</option>
    </select>
    <main class="flex"></main>
    <template id="template-card">
        <article class="card">
            <img src="./images/bg-pattern-card.jpg" alt="imagen header card" class="card-header">
            <div class="card-body">
                <img class="card-body-img">
                <h1 class="card-body-title"></h1>
                <p class="card-body-text"></p>
            </div>
            <div class="card-footer">
                <div class="card-footer-social">
                    <h3 class="stat0"></h3>
                    <p>Hp</p>
                </div>
                <div class="card-footer-social">
                    <h3 class="stat1"></h3>
                    <p>Attack</p>
                </div>
                <div class="card-footer-social">
                    <h3 class="stat2"></h3>
                    <p>Defense</p>
                </div>
                    <div class="card-footer-social">
                    <h3 class="stat3"></h3>
                    <p>S.Attack</p>
                </div>
                <div class="card-footer-social">
                    <h3 class="stat4"></h3>
                    <p>S.Defense</p>
                </div>
                <div class="card-footer-social">
                    <h3 class="stat5"></h3>
                    <p>Speed</p>
                </div>
            </div>
        </article>
    </template>
    <script src="js/app.js"></script>
</body>
</html>
